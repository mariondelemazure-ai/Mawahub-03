<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="MawaHub 03 – Programme d’incubation algéro-marseillais 2026-2027 : présentation et pitchs vidéo des 10 lauréat(e)s.">
<style>*,*::before,*::after{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mawahub – Programme incubation 2026-2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --navy: #100454;
    --navy-2: #1a0e6b;
    --ink: #f4f2ff;
    --muted: #a9a3d6;
    --yellow: #f6e969;
    --cyan: #08fcfc;
    --line: rgba(246, 233, 105, .22);
    --font: "Alexandria", "Segoe UI", system-ui, sans-serif;
  }
  html, body { background: var(--navy); color: var(--ink); }
  body { font-family: var(--font); font-weight: 300; margin: 0; padding-inline: 16px; }

  .top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    max-width: 1200px; margin: 0 auto; padding-block: 14px;
    background: var(--navy); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; flex: 1 1 auto; min-width: 0; }
  .brand b { font-weight: 600; font-size: 20px; letter-spacing: .02em; color: var(--yellow); }
  .brand span { font-size: 14px; color: var(--muted); }
  .btn {
    font: 600 13px/1 var(--font); letter-spacing: .04em; text-transform: uppercase;
    color: var(--navy); background: var(--yellow); border: 0; border-radius: 3px;
    padding: 11px 16px; cursor: pointer;
  }
  .btn:hover { background: #fff27d; }
  .btn:focus-visible, .hot:focus-visible, .nav button:focus-visible, .lnk:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }

  .intro { max-width: 1200px; margin: 0 auto; padding-block: 18px 6px; font-size: 14px; color: var(--muted); }
  .intro strong { color: var(--cyan); font-weight: 400; }

  main { max-width: 1200px; margin: 0 auto; padding-block: 12px 48px; display: grid; gap: 28px; }
  figure { margin: 0; display: grid; gap: 8px; }
  figcaption { display: flex; gap: 10px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
  figcaption em { font-style: normal; color: var(--yellow); }
  .slide { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #fff; border-radius: 4px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .slide img { display: block; width: 100%; height: 100%; }

  /* clickable areas, positioned in % of the 960×540 pt slide */
  .hot { position: absolute; border: 0; padding: 0; margin: 0; background: transparent; cursor: pointer; border-radius: 5% / 2.8%; }
  .hot::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 0 0 0 var(--cyan); transition: box-shadow .2s; }
  .hot:hover::after { box-shadow: 0 0 0 3px var(--cyan); }
  .vid { position: absolute; object-fit: cover; background: #120358; border-radius: 5% / 2.8%; }
  .lnk { position: absolute; display: block; border-radius: 999px; }
  .lnk:hover { box-shadow: 0 0 0 2px var(--cyan); }

  footer { max-width: 1200px; margin: 0 auto; padding-block: 0 32px; font-size: 12px; color: var(--muted); }

  /* ---------- presentation mode ---------- */
  .nav { display: none; }
  body.presenting { overflow: hidden; }
  body.presenting .top, body.presenting .intro, body.presenting footer, body.presenting figcaption { display: none; }
  body.presenting main { position: fixed; inset: 0; max-width: none; padding: 0; display: grid; place-items: center; background: #07022b; z-index: 10; }
  body.presenting figure { display: none; }
  body.presenting figure.current { display: grid; width: min(calc(100vw - 32px), calc((100vh - 84px) * 16 / 9)); }
  body.presenting .nav {
    display: flex; position: fixed; z-index: 11; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    justify-content: center; align-items: center; gap: 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .nav button {
    font: 400 14px/1 var(--font); color: var(--ink); background: var(--navy-2); border: 1px solid var(--line);
    border-radius: 3px; padding: 10px 14px; cursor: pointer;
  }
  .nav button:hover { border-color: var(--yellow); color: var(--yellow); }
  @media (prefers-reduced-motion: reduce) { .hot::after { transition: none; } }
  @media (max-width: 560px) { .brand span { font-size: 12px; } main { gap: 20px; } }
</style>

</head>
<body>
<header class="top">
  <div class="brand"><b>MAWAHUB</b><span>Programme d’incubation 2026-2027</span></div>
  <button class="btn" id="present" type="button">Présenter ▸</button>
</header>
<p class="intro">Faites défiler les 13 slides. Sur les slides lauréat(e)s, <strong>cliquez sur l’encadré bleu</strong> pour lancer le pitch vidéo du porteur de projet.</p>

<main id="deck"></main>

<div class="nav" role="toolbar" aria-label="Navigation de la présentation">
  <button type="button" id="prev" aria-label="Slide précédente">◂</button>
  <span id="count">1 / 13</span>
  <button type="button" id="next" aria-label="Slide suivante">▸</button>
  <button type="button" id="exit">Quitter (Échap)</button>
</div>

<footer>Institut français d’Algérie · MawaHub 03 · Industries culturelles et créatives</footer>

<script>
(() => {
  const W = 960, H = 540;
  const pct = (v, t) => (v / t * 100) + '%';
  const V = { x: [48.9, 498.9], y: 136.5, w: 176, h: 313 };
  const SLIDES = [
    { t: 'Couverture' },
    { t: 'MawaHub 2023 – 2026' },
    { t: 'Programmes MawaHub' },
    { t: 'MawaHub 03 · Action #1' },
    { t: 'MawaHub 03 · Action #2' },
    { t: 'Calendrier du programme d’incubation', links: [{ x: 50, y: 380, w: 256, h: 29, href: 'https://mariondelemazure-ai.github.io/Mawahub-03/', label: 'Découvrir le mini-site des lauréat(e)s' }] },
    { t: 'Les 10 lauréat(e)s · 1/5', v: [['SOUNDSCAPE', 'SOUNDSCAPE'], ['Traça', 'Traca']] },
    { t: 'Les 10 lauréat(e)s · 2/5', v: [['SOUKLab', 'SOUKLab'], ['IOMNIS', 'IOMNIS']] },
    { t: 'Les 10 lauréat(e)s · 3/5', v: [['Flavors Trail', 'Flavors_Trail'], ['Eclipse Project', 'Eclipse_Project']] },
    { t: 'Les 10 lauréat(e)s · 4/5', v: [['OASIS', 'OASIS'], ['BAVARDz', 'BAVARDz']] },
    { t: 'Les 10 lauréat(e)s · 5/5', v: [['SkillED', 'SkillED'], ['ArtVerse', 'ArtVerse']] },
    { t: 'Partenaires du programme incubation' },
    { t: 'Merci !' },
  ];
  const deck = document.getElementById('deck');
  const pad = n => String(n).padStart(2, '0');

  SLIDES.forEach((s, i) => {
    const fig = document.createElement('figure');
    fig.id = 'slide-' + (i + 1);
    fig.innerHTML = `<figcaption><em>${pad(i + 1)} / ${SLIDES.length}</em>${s.t}</figcaption>
      <div class="slide"><img src="slides/slide-${pad(i + 1)}.jpg" alt="Slide ${i + 1} : ${s.t}" ${i > 1 ? 'loading="lazy"' : ''}></div>`;
    const box = fig.querySelector('.slide');
    (s.v || []).forEach(([name, file], k) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'hot';
      b.setAttribute('aria-label', 'Lire le pitch vidéo de ' + name);
      Object.assign(b.style, { left: pct(V.x[k], W), top: pct(V.y, H), width: pct(V.w, W), height: pct(V.h, H) });
      b.addEventListener('click', () => {
        document.querySelectorAll('video').forEach(o => o.pause());
        const v = document.createElement('video');
        v.className = 'vid'; v.src = 'videos/' + file + '.mp4';
        v.poster = 'videos/' + file + '.jpg'; v.controls = true; v.playsInline = true; v.preload = 'auto';
        v.setAttribute('aria-label', 'Pitch vidéo ' + name);
        Object.assign(v.style, { left: b.style.left, top: b.style.top, width: b.style.width, height: b.style.height });
        b.replaceWith(v);
        v.play().catch(() => {});
      });
      box.appendChild(b);
    });
    (s.links || []).forEach(l => {
      const a = document.createElement('a');
      a.className = 'lnk'; a.href = l.href; a.target = '_blank'; a.rel = 'noopener';
      a.setAttribute('aria-label', l.label);
      Object.assign(a.style, { left: pct(l.x, W), top: pct(l.y, H), width: pct(l.w, W), height: pct(l.h, H) });
      box.appendChild(a);
    });
    deck.appendChild(fig);
  });

  // ---------- presentation mode ----------
  const figs = [...deck.children];
  let cur = 0;
  const count = document.getElementById('count');
  function show(n) {
    cur = Math.max(0, Math.min(figs.length - 1, n));
    figs.forEach((f, i) => f.classList.toggle('current', i === cur));
    document.querySelectorAll('video').forEach(v => { if (!figs[cur].contains(v)) v.pause(); });
    count.textContent = (cur + 1) + ' / ' + figs.length;
  }
  function start() {
    const y = window.scrollY;
    const idx = figs.findIndex(f => f.getBoundingClientRect().bottom > 80);
    document.body.classList.add('presenting');
    show(idx < 0 ? 0 : idx);
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  }
  function stop() {
    document.body.classList.remove('presenting');
    figs.forEach(f => f.classList.remove('current'));
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    figs[cur].scrollIntoView({ block: 'start' });
  }
  document.getElementById('present').addEventListener('click', start);
  document.getElementById('exit').addEventListener('click', stop);
  document.getElementById('prev').addEventListener('click', () => show(cur - 1));
  document.getElementById('next').addEventListener('click', () => show(cur + 1));
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && document.body.classList.contains('presenting')) stop();
  });
  document.addEventListener('keydown', e => {
    if (!document.body.classList.contains('presenting')) return;
    if (e.target.tagName === 'VIDEO' && (e.key === ' ' || e.key.startsWith('Arrow'))) return;
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); show(cur + 1); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); show(cur - 1); }
    else if (e.key === 'Escape') stop();
  });
})();
</script>

</body>
</html>
